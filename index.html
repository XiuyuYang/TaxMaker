<body>
<div id="root"></div>

    check: <path d="m5 12 5 5L20 7"/>,

    chart: <><path d="M4 20V8M10 20V4M16 20v-7M22 20H2"/></>,

    bell: <><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20a2 2 0 0 0 4 0"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></>,

    car: <><path d="M4 16h16v-4l-2-5H6l-2 5v4z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/><path d="M4 13h16"/></>,

    grid: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
    scan: <><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></>,

// ── Primitives ───────────────────────────────────────────────────────────────
const fmt = (n,dp=2) => new Intl.NumberFormat('en-NZ',{minimumFractionDigits:dp,maximumFractionDigits:dp}).format(n);
const nz = n => '$'+fmt(n);

function IOSStatusBar({ dark=false, time='9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 24px 6px', position:'relative', zIndex:20 }}>
      <span style={{ fontFamily:FONTS.ui, fontWeight:600, fontSize:15, color:c }}>{time}</span>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6.5" width="3" height="4.5" rx="0.6" fill={c}/><rect x="4.5" y="4.5" width="3" height="6.5" rx="0.6" fill={c}/><rect x="9" y="2" width="3" height="9" rx="0.6" fill={c}/><rect x="13.5" y="0" width="3" height="11" rx="0.6" fill={c} opacity="0.4"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.8C9.5 2.8 11.3 3.6 12.6 4.9L13.6 3.9C12 2.3 9.9 1.3 7.5 1.3 5.1 1.3 3 2.3 1.4 3.9L2.4 4.9C3.7 3.6 5.5 2.8 7.5 2.8Z" fill={c}/><path d="M7.5 6C8.7 6 9.8 6.5 10.6 7.3L11.6 6.3C10.5 5.2 9.1 4.5 7.5 4.5 5.9 4.5 4.5 5.2 3.4 6.3L4.4 7.3C5.2 6.5 6.3 6 7.5 6Z" fill={c}/><circle cx="7.5" cy="9.5" r="1.4" fill={c}/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke={c} strokeOpacity="0.35" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill={c}/><path d="M23 4V8C23.8 7.7 24.5 6.8 24.5 6 24.5 5.2 23.8 4.3 23 4Z" fill={c} fillOpacity="0.4"/></svg>
      </div>
    </div>
  );
}

function ScreenStatusBar({ dark }) {
  return <div style={{ position:'absolute', top:0, left:0, right:0, zIndex:10 }}><IOSStatusBar dark={dark}/></div>;
}

function Screen({ t, children, bg }) {
  return (
    <div style={{ height:'100%', width:'100%', background:bg||t.appBg, color:t.textPrimary, fontFamily:FONTS.ui, overflow:'hidden', position:'relative', display:'flex', flexDirection:'column' }}>
      {children}
    </div>
  );
}

function Body({ children, style={} }) {
  return <div style={{ flex:1, overflowY:'auto', overflowX:'hidden', WebkitOverflowScrolling:'touch', ...style }}>{children}</div>;
}

function Card({ t, children, style={}, pad=16 }) {
  return <div style={{ background:t.surface, borderRadius:14, padding:pad, border:`1px solid ${t.border}`, boxShadow:t.shadowCard, ...style }}>{children}</div>;
}

function Chip({ t, label, tone='default', icon, size='md' }) {
  const tones = {
    default:{ bg:t.surfaceMuted, fg:t.textSecondary },
    brand:  { bg:t.brandSoft,   fg:t.brandDeep },
    success:{ bg:t.successSoft, fg:t.success },
    warn:   { bg:t.warningSoft, fg:t.warning },
    danger: { bg:t.dangerSoft,  fg:t.danger },
    accent: { bg:t.accentSoft,  fg:t.accent },
  };
  const s = tones[tone]||tones.default;
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:4, background:s.bg, color:s.fg, padding:size==='sm'?'2px 8px':'4px 10px', borderRadius:999, fontSize:size==='sm'?11:12, fontWeight:600, letterSpacing:0.1, lineHeight:1.3, whiteSpace:'nowrap', fontFamily:FONTS.ui }}>
      {icon && <Icon name={icon} size={size==='sm'?12:14}/>}
      {label}
    </span>
  );
}

function Button({ t, children, variant='primary', icon, iconRight, size='md', block, onClick, style={} }) {
  const variants = {
    primary:  { bg:t.brand, fg:'#fff', border:'transparent' },
    deep:     { bg:t.brandDeep, fg:'#fff', border:'transparent' },
    secondary:{ bg:t.surface, fg:t.textPrimary, border:t.borderStrong },
    ghost:    { bg:'transparent', fg:t.textPrimary, border:'transparent' },
    soft:     { bg:t.brandSoft, fg:t.brandDeep, border:'transparent' },
    danger:   { bg:t.danger, fg:'#fff', border:'transparent' },
  };
  const v = variants[variant]||variants.primary;
  const sizes = { sm:{h:32,fs:13,pad:'0 12px',r:8}, md:{h:40,fs:14,pad:'0 16px',r:10}, lg:{h:48,fs:15,pad:'0 20px',r:12} };
  const sz = sizes[size]||sizes.md;
  return (
    <button onClick={onClick} style={{ height:sz.h, padding:sz.pad, borderRadius:sz.r, background:v.bg, color:v.fg, border:`1px solid ${v.border}`, fontSize:sz.fs, fontWeight:600, letterSpacing:-0.1, fontFamily:FONTS.ui, cursor:'pointer', display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6, width:block?'100%':undefined, whiteSpace:'nowrap', ...style }}>
      {icon && <Icon name={icon} size={sz.fs+4}/>}
      {children}
      {iconRight && <Icon name={iconRight} size={sz.fs+4}/>}
    </button>
  );
}

function TabBar({ t, current, onChange }) {
  const items = [
    { id:'home',   label:'概览', icon:'home' },
    { id:'list',   label:'小票', icon:'receipt' },
    { id:'capture',label:'',    icon:'plus', primary:true },
    { id:'report', label:'报表', icon:'chart' },
    { id:'me',     label:'我的', icon:'user' },
  ];
  return (
    <div style={{ position:'absolute', left:0, right:0, bottom:0, zIndex:40, background:t.surface+'E6', backdropFilter:'blur(18px) saturate(180%)', WebkitBackdropFilter:'blur(18px) saturate(180%)', borderTop:`1px solid ${t.border}`, paddingBottom:24, paddingTop:8, display:'flex', alignItems:'center', justifyContent:'space-around' }}>
      {items.map(i => {
        const active = current===i.id;
        if (i.primary) return (
          <button key={i.id} onClick={() => onChange?.(i.id)} style={{ width:48, height:48, borderRadius:14, background:t.brand, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', border:'none', cursor:'pointer', boxShadow:`0 6px 18px ${t.brand}55`, marginTop:-6 }}>
            <Icon name="camera" size={22}/>
          </button>
        );
        return (
          <button key={i.id} onClick={() => onChange?.(i.id)} style={{ background:'transparent', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:2, color:active?t.brand:t.textTertiary, width:56, padding:'4px 0' }}>
            <Icon name={i.icon} size={22} strokeWidth={active?2:1.7}/>
            <span style={{ fontSize:10.5, fontWeight:active?600:500, fontFamily:FONTS.ui }}>{i.label}</span>
          </button>
        );
      })}
    </div>
  );
}

  '交通':    { c:'#3D8CF5', icon:'car' },
  '办公用品': { c:'#7B61FF', icon:'briefcase' },
  '通讯':    { c:'#13B5B1', icon:'send' },

  '其他':    { c:'#8A98A3', icon:'tag' },
};
function CategoryDot({ cat, size=32 }) {
  const m = CAT_META[cat]||CAT_META['其他'];
  return <div style={{ width:size, height:size, borderRadius:size*0.32, background:m.c+'1F', color:m.c, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Icon name={m.icon} size={Math.round(size*0.55)} strokeWidth={1.9}/></div>;
}

function ReceiptThumb({ t, merchant, amount, rotate=0, width=120, height=160 }) {
  const id = `stripe-${merchant.replace(/\s/g,'')}`;
  return (
    <div style={{ width, height, position:'relative', transform:`rotate(${rotate}deg)`, borderRadius:6, background:'#fff', boxShadow:'0 1px 2px rgba(0,0,0,0.1), 0 6px 16px rgba(0,0,0,0.12)', overflow:'hidden', fontFamily:FONTS.mono, flexShrink:0 }}>
      <svg width="100%" height="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ position:'absolute', inset:0 }}>
        <defs><pattern id={id} width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F5F3EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#EDEAE3" strokeWidth="3"/></pattern></defs>
        <rect width={width} height={height} fill={`url(#${id})`}/>
      </svg>
      <div style={{ position:'absolute', top:10, left:10, right:10, display:'flex', flexDirection:'column', gap:3 }}>
        <div style={{ fontSize:9, fontWeight:700, color:'#1a1a1a', letterSpacing:0.5 }}>{merchant}</div>
        <div style={{ height:1, background:'#333', opacity:0.3 }}/><div style={{ height:1, background:'#333', opacity:0.2, marginTop:2 }}/><div style={{ height:1, background:'#333', opacity:0.2 }}/>
      </div>
      <div style={{ position:'absolute', bottom:14, left:10, right:10, display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <span style={{ fontSize:8, color:'#666' }}>TOTAL</span>
        <span style={{ fontSize:11, fontWeight:700, color:'#1a1a1a' }}>{amount}</span>
      </div>
      <svg width="100%" height="6" viewBox={`0 0 ${width} 6`} preserveAspectRatio="none" style={{ position:'absolute', bottom:0, left:0 }}>
        <path d={`M0 0 ${Array.from({length:Math.floor(width/6)}).map((_,i) => `L${i*6+3} 6 L${i*6+6} 0`).join(' ')} L${width} 0 L${width} 6 L0 6 Z`} fill="#fff"/>
      </svg>
    </div>
  );
}

// ── Screen 1: Dashboard ───────────────────────────────────────────────────────

// ── App Root ──────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [darkMode, setDarkMode] = useState(false);
  const t = darkMode ? TOKENS.dark : TOKENS.light;

  const onNavigate = (s) => {
    if (s === 'capture') { setScreen('capture'); return; }
    if (s === 'me') { setScreen('me'); return; }
    setScreen(s);
  };

  const screens = {
    home:    <DashboardScreen t={t} onNavigate={onNavigate}/>,
    capture: <CaptureScreen  t={t} onNavigate={onNavigate}/>,
    confirm: <ConfirmScreen  t={t} onNavigate={onNavigate}/>,
    list:    <ListScreen     t={t} onNavigate={onNavigate}/>,
    report:  <ReportScreen   t={t} onNavigate={onNavigate}/>,
    detail:  <DetailScreen   t={t} onNavigate={onNavigate}/>,
    me:      <SettingsScreen t={t} onNavigate={onNavigate}/>,
    batch:   <BatchScreen    t={t} onNavigate={onNavigate}/>,
  };

  return (
    <div style={{ width:'100%', height:'100%', position:'relative' }}>
      {screens[screen] || screens.home}
      {/* Dark/light toggle */}
      <button
        onClick={() => setDarkMode(d => !d)}
        style={{ position:'absolute', bottom:96, right:16, zIndex:100, width:38, height:38, borderRadius:19, background:darkMode?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.12)', border:'none', color:darkMode?'#fff':'#333', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)', boxShadow:'0 2px 8px rgba(0,0,0,0.2)' }}
        title={darkMode?'切换浅色模式':'切换深色模式'}
      >
        <Icon name={darkMode?'sun':'moon'} size={18}/>
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
