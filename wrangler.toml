name = "taxmaker"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets — built frontend served alongside the Worker
[assets]
directory = "./frontend/dist"
binding = "ASSETS"

# Route: all /tax/* traffic goes to this Worker
routes = [
  { pattern = "sqdyxy.com/tax/*", zone_name = "sqdyxy.com" }
]

[vars]
GEMINI_MODEL = "google/gemini-2.0-flash-exp:free"
AI_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions"
BASE_PATH = "/tax"
SESSION_DAYS = "30"
MAX_UPLOAD_MB = "10"

[[d1_databases]]
binding = "DB"
database_name = "tax-db"
database_id = "d37b9e41-7af2-4cb8-9eae-a290dcab7a70"

[[r2_buckets]]
binding = "R2"
bucket_name = "tax-receipts"

[dev]
port = 8787
local_protocol = "http"

# Secrets (set via `wrangler secret put GEMINI_API_KEY` in production)
# For local dev: put in .dev.vars (never commit that file)
